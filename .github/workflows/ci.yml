name: CI

on:
  pull_request: ~
  push: ~

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage.lcov "test/*.test.js"
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov

  bundle:
    name: Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: plutil -lint src/info.plist
      - run: ./bundle
